name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: careerpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Use the test database for both alembic (DATABASE_URL) and tests (TEST_DATABASE_URL)
      DATABASE_URL: "postgresql+psycopg://careerpilot:testpassword@localhost:5432/careerpilot_test"
      TEST_DATABASE_URL: "postgresql+psycopg://careerpilot:testpassword@localhost:5432/careerpilot_test"
      # Required secrets for settings (can be dummy values for tests)
      SUPABASE_URL: "http://localhost:8000"
      SUPABASE_KEY: "dummy-key"
      SUPABASE_JWT_SECRET: "dummy-secret"
      SUPABASE_SECRET_KEY: "dummy-secret-key"
      SECRET_KEY: "dummy-secret-key"
      GEMINI_API_KEY: "dummy-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations
        working-directory: ./backend
        run: alembic upgrade head

      - name: Run Tests
        working-directory: ./backend
        run: |
          pytest test_opportunity_matching.py test_opportunity_matching_api.py test_opportunity_lifecycle.py test_saved_opportunities.py test_semantic_matching.py test_jsearch_ingestion.py test_rss_ingestion.py test_phase64_scheduled_refresh.py test_skill_gap_roadmap.py test_cover_letter.py test_application_assistant.py
